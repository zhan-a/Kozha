name: Security

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          # gitleaks-action@v2 requires GITHUB_TOKEN to scan pull_request
          # events (it diffs the PR commits via the API); without it the
          # job hard-fails on every PR.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # gitleaks-action@v2 reads its config from GITLEAKS_CONFIG, not a
          # `config-path` input (that input is rejected with a warning, and
          # the repo allowlist would then be ignored).
          GITLEAKS_CONFIG: ${{ github.workspace }}/.gitleaks.toml
          GITLEAKS_NOTIFY_USER_LIST: ""

  pip-audit:
    name: Python dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Audit backend requirements
        # Fail on CRITICAL and HIGH severities. We keep MEDIUM / LOW
        # as informational so the CI job stays green on advisories we
        # can triage within the documented upgrade policy window.
        run: |
          pip-audit \
            --requirement backend/chat2hamnosys/requirements.txt \
            --strict \
            --vulnerability-service osv \
            || (echo "::error::pip-audit found vulnerabilities" && exit 1)

  npm-audit:
    name: npm dependency audit
    runs-on: ubuntu-latest
    # Audits the frontend/dev toolchain declared in package.json +
    # package-lock.json. (Previously gated on a job-level hashFiles()
    # if-condition, which GitHub's workflow compiler rejects — that
    # invalid expression was failing the entire Security workflow at
    # startup on every push. package.json now exists, so just run.)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: npm audit (high+ critical)
        # Only production deps reach the shipped site (static HTML +
        # vendored CWASA + Python backend). package.json holds dev/CI
        # tooling only (puppeteer, pa11y, …), so audit production scope —
        # dev-only transitive advisories must not fail the security gate.
        run: npm audit --omit=dev --audit-level=high

  tests:
    name: Security tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          pip install -r backend/chat2hamnosys/requirements.txt
      - name: Run security test suite
        working-directory: backend/chat2hamnosys
        run: |
          pytest tests/test_security_sanitize.py tests/test_security_injection.py tests/test_security_rate_limit.py tests/test_security_pii.py tests/test_security_gitleaks.py -v
